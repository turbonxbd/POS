name: server-php tests

on:
  push:
    branches: [main, master]
    paths: ['server-php/**', 'js/services/media-service.js']
  pull_request:
    paths: ['server-php/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none
      - name: Run the in-process route tests (SQLite)
        working-directory: server-php
        run: php tests/run.php
